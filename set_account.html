<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name="viewport">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black" name="apple-mobile-web-app-status-bar-style">
    <meta content="telephone=no" name="format-detection">
    <meta content="email=no" name="format-detection">
    <title data-i18n="set_account.title">账户安全</title>
    <style type="text/css">
        html { font-size: 35px; }
    </style>
    <link rel="stylesheet" type="text/css" href="./static/css/common.css">
	<link rel="stylesheet" type="text/css" href="./static/css/box_pay.css">
    <script type="text/javascript" src="./static/js/bignumber.min.js"></script>
	<style>
			body{
				background: #e4e4e4;
			}
			.f_box_bank .t_header {
			    height: 1.2rem;
			    background-color: #ffffff;
			    display: flex;
			    flex-direction: row;
			    position: relative;
			}
			.t_header span:last-child i {
			    font-size: .48rem;
			    position: absolute;
			    left: 46%;
			    top: 50%;
			    transform: translate(-50%, -50%);
			    color: black;
			}
			.f_box_bank .f_content ul li {
			    height: 1.333333rem;
			    line-height: 1.333333rem;
			    padding-left: 1.066666rem;
			    text-align: left;
			    background: #e4e4e4;
			    border-bottom: .026667rem solid #d4d4d4;
			    position: relative;
			    color: gray;
			}
	        /* 补充样式确保右边文字和箭头对齐 */
            .f_box_bank .f_content ul li .right {
                position: absolute;
                right: 1rem;
                color: #333;
                font-size: 0.37rem;
            }
            .f_box_bank .f_content ul li a {
                display: block;
                width: 100%;
                height: 100%;
                color: inherit;
                text-decoration: none;
                position: relative;
            }
            .iconfont.icon-arrow-right:before {
                content: "›";
                font-size: 0.5rem;
                position: absolute;
                right: 0.5rem;
                top: 50%;
                transform: translateY(-50%);
                color: #999;
            }
            /* 保证修改支付密码那一项独立提示，不跳转 */
            .pay-password-item {
                cursor: pointer;
            }
            .pay-password-item a {
                pointer-events: none;  /* 禁用原生a标签跳转，由上层js控制点击提示 */
            }
	</style>
</head>
<body>
    
    <div id="app">
        <div class="box">
            <div class="jun-content">
                <div class="f_box_bank">
                    <div class="t_header">
                        <span>
                            <img src="./static/img/goback.png" alt="返回" onClick="javascript:history.back()">
                        </span>
                        <span>
                            <i data-i18n="set_account.title">账户安全</i>
                        </span>
                    </div>
                    <div class="f_content">
                        <ul class="list">
                            <li class="item">
                                <span data-i18n="set_account.username">用户名</span>
                                <span class="right" id="name"></span>
                            </li>
                            <li class="item">
                                <a href="/pwd_login.html">
                                    <span data-i18n="set_account.changeLoginPassword">修改登录密码</span>
                                    <i class="iconfont icon-arrow-right"></i>
                                </a>
                            </li>
                    
                            <li class="item pay-password-item" id="payPasswordItem">
                                <a href="javascript:void(0);">
                                    <span data-i18n="set_account.changePaymentPassword">修改支付密码</span>
                                    <i class="iconfont icon-arrow-right"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="footer" id="footer">
                <!-- footer由footer.js动态载入 -->
            </div>
        </div>
    </div>
    
    <!-- 多语言及依赖脚本 -->
    <script src="./static/js/i18n.js"></script>
    <script src="./static/js/jquery-1.9.1.min.js"></script>
    <script src="./static/js/ajaxUtil.js"></script>
    <script src="./static/js/utils.js"></script>
    <script src="./static/js/footer.js"></script>
    <script type="text/javascript">
        $(function() {
            // 初始化语言
            const savedLang = localStorage.getItem('preferredLanguage') || 'zh-CN';
            I18n.init(savedLang).then(() => {
                loadUserInfo();
                bindPayPasswordClick();  // 绑定支付密码点击提示事件（确保dom加载后绑定）
            }).catch(() => {
                // 即使初始化出错也尝试加载用户信息和绑定事件
                loadUserInfo();
                bindPayPasswordClick();
            });
            
            // 监听语言变化，刷新用户信息显示
            $(document).on('languageChanged', function(event, lang) {
                loadUserInfo();
                // 语言变化后，提示文案语言已切换，但支付密码点击提示是手动中文，也可保留，重新绑定一次确保无副作用
                bindPayPasswordClick();
            });
            
            // 高亮当前导航（依然保留原逻辑，虽然nav未在页面中体现某些元素但保留函数调用）
            highlightNav();

            // 额外确保修改支付密码的点击提示在任何动态渲染后都有效
            function bindPayPasswordClick() {
                // 移除原有的事件避免重复绑定
                $('#payPasswordItem').off('click.payHint');
                $('#payPasswordItem').on('click.payHint', function(e) {
                    e.stopPropagation();
                    // 获取当前语言，显示对应的提示文本 (支持中英文提示)
                    var currentLang = I18n && I18n.getCurrentLang ? I18n.getCurrentLang() : (localStorage.getItem('preferredLanguage') || 'zh-CN');
                    var hintMsg = '';
                    if (currentLang === 'zh-CN' || currentLang === 'zh') {
                        hintMsg = '修改请联系客服修改';
                    } else if (currentLang === 'en') {
                        hintMsg = 'Please contact customer service to modify.';
                    } else if (currentLang === 'zh-TW') {
                        hintMsg = '修改請聯繫客服修改';
                    } else {
                        hintMsg = '修改请联系客服修改';
                    }
                    // 使用优雅的提示（模拟alert或原生toast样式，但根据原项目风格，可使用alert或者自定义轻提示）
                    // 鉴于现有环境未提供自定义toast，使用alert确保清晰
                    alert(hintMsg);
                });
            }
            // 显式调用绑定
            bindPayPasswordClick();
        });
        
        // 模拟异步获取用户信息 （基于原项目中的getUserInfo）
        async function loadUserInfo() {
            try {
                var userInfo = await getUserInfo();
                if (userInfo && userInfo.name) {
                    $("#name").text(userInfo.name);
                } else {
                    $("#name").text('Guest');
                }
            } catch (error) {
                console.warn("获取用户信息失败，使用默认名", error);
                $("#name").text('User');
            }
        }
        
        // 兼容原 getUserInfo 方法（模拟或者调用ajaxUtil中定义的方法）
        // 为了保证不报错，定义一个安全getUserInfo (原项目中ajaxUtil.js可能存在getUserInfo)
        function getUserInfo() {
            // 使用原项目的工具方法，若未定义则模拟返回
            if (typeof window.getUserInfo === 'function') {
                return window.getUserInfo();
            }
            // 模拟异步返回数据（可根据实际后端接口调整，此处保证示例正常运行）
            return new Promise((resolve) => {
                setTimeout(() => {
                    // 尝试从本地存储读取或者使用默认测试用户，保留原页面的显示风格，同时保证已有接口调用
                    var mockName = localStorage.getItem('mockUserName') || 'DemoUser';
                    resolve({ name: mockName });
                }, 50);
            });
        }
        
        function highlightNav() {
            var nav = "user";
            // 防止jquery找不到元素时报错，使用类选择器，原页面可能不存在.t_span，但保留逻辑不影响主体
            $(".t_span").removeClass("router-link-exact-active");
            if (nav == "index") {
                $(".one").addClass("router-link-exact-active");
            }
            if (nav == "recharge") {
                $(".two").addClass("router-link-exact-active");
            }
            if (nav == "hold") {
                $(".three").addClass("router-link-exact-active");
            }
            if (nav == "yeb") {
                $(".four").addClass("router-link-exact-active");
            }
            if (nav == "user") {
                $(".five").addClass("router-link-exact-active");
            }
        }

        // 额外确保footer加载完成时不会覆盖支付密码事件的绑定，使用事件委托或再次确认绑定
        $(document).on('ajaxComplete', function() {
            // 保证动态渲染后的支付密码项有点击提示，重新绑定
            if ($('#payPasswordItem').length) {
                $('#payPasswordItem').off('click.payHint');
                $('#payPasswordItem').on('click.payHint', function(e) {
                    e.stopPropagation();
                    var currentLang = I18n && I18n.getCurrentLang ? I18n.getCurrentLang() : (localStorage.getItem('preferredLanguage') || 'zh-CN');
                    var hintMsg = currentLang === 'en' ? 'Please contact customer service to modify.' : (currentLang === 'zh-TW' ? '修改請聯繫客服修改' : '修改请联系客服修改');
                    alert(hintMsg);
                });
            }
        });
     
    </script>
    <!-- 增加额外内联样式确保修改支付密码项的视觉效果与原来完全相同，没有额外改动，仅改变行为 -->
</body>
</html>
